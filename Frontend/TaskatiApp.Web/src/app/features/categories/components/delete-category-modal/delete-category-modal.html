<div class="modal-overlay" role="presentation" (click)="closeOnOverlayClick($event)">
	<section class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-category-title">
		<header class="modal-header">
			<div>
				<h2 id="delete-category-title">Delete Category?</h2>
				<p>
					Are you sure you want to delete <strong>"{{ category().name }}"</strong>? This action cannot be undone.
				</p>
			</div>
			<button class="close-button" type="button" aria-label="Close" (click)="cancel()">&times;</button>
		</header>

		@if (errorMessage()) {
			<p class="form-error" role="alert">{{ errorMessage() }}</p>
		}

		<div class="form-actions">
			<button class="cancel-button" type="button" [disabled]="isSubmitting()" (click)="cancel()">
				Cancel
			</button>
			<button class="delete-button" type="button" [disabled]="isSubmitting()" (click)="deleteCategory()">
				{{ isSubmitting() ? 'Deleting...' : 'Delete' }}
			</button>
		</div>
	</section>
</div>
